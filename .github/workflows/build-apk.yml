name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Sync Capacitor Web Assets & Config
        run: npx --yes @capacitor/cli copy android || true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 platforms;android-36 build-tools;35.0.0'

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee ../gradle.log

      - name: Report Failure to Commit Comment
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 - << 'EOF'
          import json, os, urllib.request
          token = os.environ.get('GITHUB_TOKEN')
          repo = os.environ.get('GITHUB_REPOSITORY')
          sha = os.environ.get('GITHUB_SHA')
          try:
              with open('gradle.log', 'r', errors='ignore') as f:
                  log_text = f.read()
              lines = log_text.strip().split('\n')
              tail_lines = '\n'.join(lines[-60:])
              data = json.dumps({"body": f"### ❌ Android Build Error Log\n```text\n{tail_lines}\n```"}).encode('utf-8')
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/commits/{sha}/comments",
                  data=data,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "GitHub-Action",
                      "Content-Type": "application/json"
                  }
              )
              urllib.request.urlopen(req)
              print("Successfully posted error comment to commit!")
          except Exception as e:
              print(f"Failed to post comment: {e}")
          EOF

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle.log
          retention-days: 7

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CelenganKita-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish APK to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk-debug
          name: CelenganKita Android App (Debug)
          body: |
            ### 📱 CelenganKita Android Companion App (Debug Build)
            - **URL Webview**: https://celengan-kita-two.vercel.app
            - **Fitur Khusus**: Bank & E-Wallet Notification Listener (Human-in-the-Loop)
            - **Download Link Langsung**: Klik file APK di bawah pada smartphone Android Anda untuk langsung download dan instal.
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
